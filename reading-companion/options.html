<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reading Companion — Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 20px;
      }
      label {
        display: block;
        margin: 18px 0 6px;
        font-weight: 600;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
      }
      .hint {
        color: #888;
        font-size: 12px;
        margin-top: 4px;
      }
      button {
        margin-top: 22px;
        padding: 9px 18px;
        font-size: 14px;
        background: #1a1a1a;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #status {
        margin-left: 12px;
        color: #2e7d32;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Reading Companion</h1>

    <label for="apiKey">DeepSeek API key</label>
    <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
    <div class="hint">Stored locally in your browser only. Never sent anywhere except DeepSeek.</div>

    <label for="model">Model</label>
    <input id="model" type="text" placeholder="deepseek-chat" />

    <label for="nativeLanguage">Native language (explanations are written in this)</label>
    <input id="nativeLanguage" type="text" placeholder="English" />

    <div>
      <button id="save">Save</button>
      <span id="status"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
