<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reading Companion</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        margin: 0;
        padding: 12px 14px;
        color: #1a1a1a;
      }
      header {
        position: sticky;
        top: 0;
        background: #fff;
        padding-bottom: 8px;
        border-bottom: 1px solid #eee;
      }
      h1 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #999;
        margin: 0 0 2px;
      }
      #article-title {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        word-break: break-word;
      }
      #count {
        color: #888;
        font-size: 12px;
        margin-top: 2px;
      }
      #empty {
        color: #888;
        margin-top: 24px;
        text-align: center;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        padding: 12px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .sel {
        font-weight: 600;
        font-size: 15px;
      }
      .pron {
        color: #888;
        font-size: 12px;
        margin-left: 6px;
      }
      .meaning {
        margin-top: 3px;
      }
      .explanation {
        color: #444;
        margin-top: 3px;
        font-size: 13px;
      }
      .context {
        color: #999;
        font-size: 12px;
        font-style: italic;
        margin-top: 4px;
        border-left: 2px solid #eee;
        padding-left: 8px;
      }
      .remove {
        float: right;
        background: none;
        border: none;
        color: #bbb;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }
      .remove:hover {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Saved words</h1>
      <p id="article-title">—</p>
      <div id="count"></div>
    </header>
    <div id="empty">No saved words for this article yet. Select text and click <b>Save</b>.</div>
    <ul id="list"></ul>
    <script src="sidepanel.js"></script>
  </body>
</html>
