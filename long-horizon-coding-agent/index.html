# 面试题解答：连续执行 2 小时任务的 Coding Agent 设计

> **题目**：设计一个能连续执行 2 小时任务的 coding agent，如何设计它的**上下文管理**、**任务状态记录**、**工具调用失败恢复**和**用户中断机制**？
> **AI 协作说明**:本方案的核心思路与框架由本人提出;AI(Claude)负责方案细节细化和撰写与语言风格润色。
> **适用范围**:本方案面向 **copilot 模式**——用户委派长任务后离开、仅在任意时刻偶发介入,而非逐轮紧耦合的**人机协作模式**;故以"长程自主 + 任意点干净中断"为前提,不在每步等待人类确认。

---

## 0. 问题本质

2 小时任务相对于短时任务是一次质变：短任务中可忽略的单步错误率，在完整运行中累积为近乎必然的错误；微小的信息丢失则累积成系统性漂移。

---

## 1. 上下文管理

**核心威胁——上下文污染**：错误事实进入某次摘要后持续存在，并误导全部下游推理。它使 agent 随运行时间不断变差，且一旦发生极难察觉。

**方案**：按信息类型分层（L0–L3）+ 入口验证器 + 独立子 agent。

### 1.1 设计图

把上下文窗口看作一块**容量固定的工作台**：子 agent 是台前管家，验证器是工作台的安检门，环境是台下唯一真相源。四层（L0–L3）按"是否常驻、占比多少"分层叠放。

```
        ┌──────── 子 Agent（管家 · 独立预算）────────┐
        │   ① 分类    ② 验证    ③ 检索    ④ 压缩       │
        └──────────────┬─────────────────────────────┘
  流入信息 ──①分类──▶   │ ②验证
                       ▼
                ╔══[ 安检门 ]══╗   ✗ 拒绝 / 退回核查
                ║   入口验证器  ║───────────────▶ ✗
                ╚══════╤═══════╝   ✓ 通过
  ┌────────────────────▼──── 上下文窗口（工作台）────────────────────┐
  │ L3 长期记忆 ……开场载入为背景，会话末回写                          │
  ├──────────────────────────────────────────────────────────────┤
  │ ★ L2 会话记忆 ……占比最大·跨压缩常驻                              │
  │              ◀──③检索（按当前任务取） ◀──④压缩（超限按相关性裁） │
  ├──────────────────────────────────────────────────────────────┤
  │ L1 工作状态 ……每轮从状态存储注入                                 │
  ├──────────────────────────────────────────────────────────────┤
  │ L0 环境投影 ……按需注入·用完即弃·不常驻                           │
  └───────────────────────────────▲──────────────────────────────┘
                                   │ 实时查询（绝不缓存）
                       ┌───────────┴───────────┐
                       │   L0 环境 · 唯一真相    │  文件 · 测试 · git · 构建
                       └───────────────────────┘

  旁路：原始对话 / 冗长输出 / 中间推理 ── 不入 L0–L3 ──▶ ④压缩优先丢弃
```

**读图**：管家（子 agent）用①②③④四个动作把信息送上 / 移出工作台；新知识进 L2 前必过安检门（验证器）；L0 永远从台下真相源现取、用完即弃；L2 是窗口里占比最大的常驻层。

### 1.2 要点

- **L0 为唯一真相**：从不缓存，只按需查询，是其余各层的验证基准。
- **L2 为窗口常驻主体**：窗口按"类型"而非"时间近远"策展——50 轮前的调试配方优先于 2 轮前的冗长文件列表。
- **入口验证器把污染挡在门口**：谎言进入因果链之前即拦截。L0 派生声明对照真实环境；L2 条目核验底层事实是否仍成立；压缩摘要返回的关键声明与环境状态交叉核对。
- **子 agent** 承担分类/验证/检索/压缩。常规轮用轻量启发式（文件读取→L0、计划更新→L1、测试失败→抽取配方进 L2），仅歧义或复杂检索动用完整 LLM 调用以控成本。

**如何解决**：污染的本质是"错误事实混入摘要后持续误导下游"。L0–L3 分类让环境真相只查不缓存，从源头切断假事实的常驻渠道；入口验证器在新知识进 L2 前就把谎言挡在因果链之外；独立子 agent 提供异于主 agent 的二次校验。三者把拦截从"事后检测"前移到"入口拦截"。

---

## 2. 任务状态记录

**核心威胁——状态与现实背离**：账本记"第 4 步：完成"，磁盘真实状态已漂移，尤其在某步半途失败后。其他机制皆从状态读取，地基腐坏则上层全坏。

### 2.1 地基：双状态架构（环境即真相，状态只记意图）

将 agent 状态拆为本质不同的两类，是任务状态记录的地基；其内核"环境即唯一真相、agent 自述不作数"也被上下文管理（L0 只查不缓存）与失败恢复（环境检查判定成败）复用。

| | **内部状态** | **环境状态** |
|---|---|---|
| 内容 | 计划、当前目标、决策、约束、推理 | 文件哈希、测试结果、构建状态、git 状态 |
| 是否有现实可偏离 | 否，它即意图本身 | 是，必须与现实对齐 |
| 更新来源 | agent 决策或用户指令 | **仅**查询真实环境，**绝不**采信 agent 自述 |

由此推出四条设计要点：

- **环境作为一切现实声明的唯一真相源** —— 同时消除状态—现实背离，并化解"状态 schema 随任务动态膨胀"（现实不再进 schema）。
- **状态 schema 只保留 agent 内部关切**（计划/步骤/决策/约束）—— 因而稳定、通用，不随任务类型变化。
- **用环境检查代替验证**：直接重新查询环境确认动作是否真生效，无需独立验证器组件。检查分两档：**cheap** 频率高、只查改动范围；**expensive** 频率低、做全局检查。
- **检查不通过即用 checkpointer 回滚**：把环境与状态一并退回动作前检查点，而非带脏状态继续。

**更新规则——变更触发而非周期触发**：每轮之后判断动作触碰了什么 → 查询现实更新对应状态切片 → 把依赖它的切片标记为陈旧 → 决策前先查相关状态是否陈旧。由此堵住直接改动的验证缺口，并把间接波及的缺口收窄到可控。

### 2.2 统一存储架构：信息层即存储

L0–L3 是"信息是什么类型"，Claude Code 的存储组件是"它物理存在哪里"。两者不是并列的两套设计，而是同一架构的两个视角：每个信息层有且仅有一个存储载体；原本为"对话即状态"设计的对话存储，则下沉为承载对话本体与崩溃恢复的**基础设施**，不再算作独立信息层。

| 信息层（是什么） | 真相来源 | 存储载体 | 生命周期 |
|---|---|---|---|
| **L0 环境** | 环境本身 | 结论不入缓存；查询投影落入 **④ 环境状态缓存**（文件哈希/测试结果/陈旧标记/依赖边，仅从环境填充）| 实时查询 |
| **L1 工作状态** | agent 意图 | **① 运行时 AppState**（计划/步骤/权限/任务/UI/MCP，中心化保证多域更新一致）| 单进程，恢复时重建 |
| **L2 会话记忆** | 从对话抽取并经环境检查 | **会话记忆库**（约定/架构/配方/教训/约束；原料取自 ② 对话流水）| 单会话 |
| **L3 长期记忆** | 跨会话沉淀 | **持久记忆目录** | 跨会话 |

**基础设施（承载对话本体与恢复，不属于任何信息层）**：

- **② 对话流水 JSONL DAG** —— 原始对话（带 uuid/parentUuid），落盘追加写；用作崩溃恢复（重建①）、审计、与 L2 抽取的原料。
- **③ 查询引擎** —— 内存中的运行时副本，专门用来拼装发往 API 的请求，是 ② 在内存里的镜像：运行时只读它（快），写则同步落入 ②；仅当崩溃重启时，才反过来从 ② 重建它。

### 2.3 设计图

状态存储只装"意图"，环境是"真相"，checkpointer 是"存档点"：

```
   用户指令 / agent 决策 ─▶ ┌─ 状态存储（只记意图：计划·步骤·决策·约束）─┐  ← schema 稳定·通用
                          └────────────────────┬──────────────────────┘
        ┌── 执行前存档 ──┐                       │ 执行动作
        ▼               │                       ▼
  ╔[ checkpointer ]╗    │              ┌──── 环境 · 唯一真相 ────┐
  ║  动作前检查点    ║    │              │ cheap  每动作后·只查改动 │ ← 频繁
  ╚═══════▲════════╝    │              │ expensive 里程碑·全局检查 │ ← 稀疏
          │             │              └───────────┬────────────┘
          │  ✗ 检查不通过（幻觉/部分失败）             │ ✓ 通过
          └─────────────┴──────────────┐           ▼
                                       └─ 回滚    步骤=完成，标记依赖陈旧
```

**读图**：现实从不进状态存储，只进环境。动作执行后用环境检查确认是否真生效——**cheap** 高频但只查改动范围，**expensive** 低频但全局兜底；通过才把步骤记为完成，不通过就用 checkpointer 整体回滚。

**关键约束**：任务"完成"不凭 agent 自认，须先通过环境查询（测试已跑、文件已回读）方记为完成——以此将任务状态（L1）钉死在环境真相（L0/④）上。

**如何解决**：背离的本质是"账本与磁盘各说各话"。双状态架构让现实只从环境进、agent 自述不作数，账本从源头无从虚报；陈旧标记在依赖变更时自动暴露"哪些记录已不可信"；环境检查不通过即用 checkpointer 整体回滚，杜绝带脏状态前进。三者使任务状态始终被环境真相约束、可随时核对。

---

## 3. 工具调用失败恢复

数千次调用中，失败是常态而非异常，恢复必须是预设好的常规流程，而非临时救火。

**核心威胁——失败循环 / 重试风暴（doom loop）**：这是工具调用恢复独有、且环境验证**解决不了**的威胁。环境查询能可靠地发现"这次失败了"，但发现失败 ≠ 走出失败——agent 往往**反复重试同一条死路**：同样的 import 改法、同样跑不过的测试、同样的报错，一轮轮重来。每次失败都被正确检测，可 agent 始终原地打转，把 2 小时预算悄悄烧光、零进展。

### 3.1 解决方案：失败恢复策略

| 策略 | 适用原因 | 动作 |
|---|---|---|
| **① 重试** | 瞬时/可恢复错误 | 退避重试，**限定次数**；超次即升级 |
| **② 降级** | 此路走不通但目标可达：API 不可用 | 改走替代方案或更简实现，记入 L2「失败教训」避免重蹈 |
| **③ 撤销** | 动作已留下脏状态/部分写入 | 用 checkpointer 回滚到动作前检查点，复位环境与状态 |
| **④ 用户自定义** | 超出自动处置边界：不可逆、影响范围大 | 按预先委派的策略处理，或升级给人（见机制四）|

### 3.2 解决方案：打破循环：失败签名 + 升级阶梯 + 预算上限

把"失败"做成**有记忆**的，循环就无处遁形：

- **失败签名（为每次失败打标）**：用「操作目标 × 错误类型」为每次失败编码（如 `auth.py × ImportError`）。签名写入 L2「失败教训」，重试前先查：**同标签已出现过？**
- **升级阶梯**：同一签名重复时**禁止原地重试**，强制沿 ① → ② → ③ → ④ 升一级——重试不行就降级换路，换路不行就撤销，仍不行就交回用户。每条死路最多走一遍。
- **预算上限**：给每个子任务设重试次数 / 时间 / token 预算；逼近上限即强制升级到 ④，确保循环最坏只吃掉一个子任务的预算，而非整场运行。

### 3.3 为何能解决核心威胁

环境验证负责"看见失败"，但看见不等于脱身。失败签名让 agent **记得自己已经撞过这堵墙**，升级阶梯保证它**每次撞墙后换一种打法**，预算上限则给整件事兜底——三者合起来把"无限重试同一条死路"压成"有限次尝试后必然换路或交人"，doom loop 被从机制上切断。

---

## 4. 用户中断机制

**核心威胁——任意点干净中断**：人类不全程盯着 2 小时，却会在任意时刻跳进来。难点在于：用户插话时 agent 多半正处于某个动作中途，既要吸收新指令，又不能在半途留下脏状态——轻则追加指令，重则改变方向、作废大量已完成工作。

**如何解决**：以「任意点重定向」为主干——收口检查点 + 失效分析 + 分支归档，让第 90 分钟改方向也能算得准、丢得起；辅以「中断转 to-do」吸收较轻的追加型指令。两者共同底线是"先到一致点、绝不脏写"。

### 4.1 主机制 · 任意点重定向：第 90 分钟改方向且不弄脏状态

**问题**：用户在第 90 分钟跳进来改目标，可能**作废大量已完成工作**。agent 须在任意点一致地收口、吸收新指令、算清失效范围，且全程不弄脏状态。（更轻的「追加型指令」由下方辅助机制处理。）

```
  用户第90分钟重定向
        │
        ▼
  ① 收口到干净检查点 ── 让进行中的动作收尾，或回滚到最近 checkpoint（④确认无半写）
        │
        ▼
  ② 吸收为新意图 ── 写入 L1，与旧目标对比 → 变化的需求集
        │
        ▼
  ③ 失效分析（沿依赖图，按"所依赖需求是否被改"分类已完成步骤）
        ├── 保留：新目标仍需
        ├── 可复用：略改即用
        └── 作废：被新目标推翻
        │
        ▼
  ④ 先确认后丢弃 ── 失效清单交用户确认（审批门）
        │
        ▼
  ⑤ 归档而非删除 ── 作废工作存到分支(可恢复)；环境只回滚作废切片；
                   保留切片原样 → 从分叉点重规划 L1
```

**一句话**：①收口检查点保证不弄脏状态，③依赖图把"丢多少旧工作"从拍脑袋变成可计算，④⑤审批门 + 分支归档保证"丢弃重大工作"既经同意又可挽回。

**辅助机制 · 中断转 to-do（应对追加型指令）**：当用户只是增补而非改向（"顺便也改下日志格式"），不立即转向——把输入整理成**带上下文的 to-do**（含原因、涉及文件、约束，可日后脱离当前对话独立执行），先把当前任务做到干净检查点再取下一项；仅当标记"紧急/阻断"时才回滚后转向。如此信息不丢、又不在半途切换，to-do 本身即任务状态记录的一部分。

      a.textContent = h.textContent.trim();
      toc.appendChild(a);
    });
  })();
